name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LabelStudio.slnx

      - name: Build
        run: dotnet build LabelStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LabelStudio.slnx --configuration Release --no-restore --no-build

      - name: Format check
        run: dotnet format LabelStudio.slnx --verify-no-changes --no-restore